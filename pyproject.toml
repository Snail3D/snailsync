[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "vlcsync"
version = "0.1.0"
description = "Watch the same movie in VLC together, on your own computers"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
dependencies = []

[project.scripts]
vlcsync = "vlcsync.cli:main"

[tool.setuptools]
packages = ["vlcsync"]